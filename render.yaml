services:
  - type: web
    name: tiny-second-hand-market
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm prisma:generate
    startCommand: pnpm start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        value: file:./render.db
      - key: SESSION_DIR
        value: ./prisma
      - key: SESSION_DB
        value: render-sessions.sqlite
      - key: UPLOAD_DIR
        value: ./storage/product-images
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
